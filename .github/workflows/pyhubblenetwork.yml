name: PyHubbleNetwork CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # pyhubblenetwork always pulls the image before starting it, so the test
    # image has to come from a registry, not just the runner's local images
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000

    steps:
      - name: Checkout hubble-satnet-decoder
        uses: actions/checkout@v6
        with:
          path: decoder-src

      - name: Checkout sdr-docker
        uses: actions/checkout@v6
        with:
          repository: HubbleNetwork/sdr-docker
          path: sdr-docker

      - name: Copy decoder source into sdr-docker context
        run: cp -r decoder-src sdr-docker/decoder-src

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build test image with local decoder and push to local registry
        uses: docker/build-push-action@v6
        with:
          context: ./sdr-docker/
          build-args: USE_LOCAL_DECODER=1
          push: true
          tags: localhost:5000/sdr-docker:pr-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout pyhubblenetwork
        uses: actions/checkout@v6
        with:
          repository: HubbleNetwork/pyhubblenetwork
          path: pyhubblenetwork

      - name: Install pyhubblenetwork
        run: |
          cd pyhubblenetwork
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run sat integration tests
        env:
          SDR_DOCKER_IMAGE: localhost:5000/sdr-docker:pr-test
        run: pytest pyhubblenetwork/tests/test_sat_integration.py -v --tb=short